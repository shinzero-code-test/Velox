<style>

            font-family: 'IBM Plex Sans Arabic', sans-serif;
            overflow: hidden;
            user-select: none;

        .glass-panel {
            background: rgba(32, 31, 31, 0.4);

<body class="relative h-screen w-full flex flex-col items-center justify-center">
<!-- Cinematic Backdrop (Shader) -->
<div class="fixed inset-0 z-0 bg-black">
<webgl-shader class="absolute inset-0 w-full h-full opacity-60" src="{{DATA:ANIMATION:ANIMATION_8}}"></webgl-shader>
<div class="absolute inset-0 gradient-overlay z-10"></div>
</div>
<!-- Video Container Area -->
<div class="relative z-20 w-full h-full flex flex-col justify-between items-center py-6 px-4 cursor-pointer" id="video-surface" onclick="toggleControls()">
<!-- Top App Bar (Visible on tap) -->
<div class="fade-controls w-full flex items-center justify-between px-2 pt-4" id="top-bar">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-white text-3xl">arrow_forward</span>
</button>
<h1 class="text-lg font-bold text-white tracking-tight">أصوات الطبيعة - غابة الخريف</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-white">more_vert</span>
</button>
</div>
<!-- Gesture Feedback Overlays (Hidden by default) -->
<div class="absolute inset-0 pointer-events-none flex items-center justify-between px-12">
<div class="gesture-indicator opacity-0 flex flex-col items-center gap-2" id="brightness-gesture">
<span class="material-symbols-outlined text-white/50 text-4xl">brightness_medium</span>
<div class="w-1 h-32 bg-white/20 rounded-full relative">
<div class="absolute bottom-0 w-full bg-white rounded-full" style="height: 60%"></div>
</div>
</div>
<!-- Central Play/Pause -->
<div class="fade-controls w-24 h-24 bg-white/10 border border-white/20 rounded-full flex items-center justify-center scale-100 hover:scale-110 transition-transform" id="central-play">
<span class="material-symbols-outlined text-white text-5xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</div>
<div class="gesture-indicator opacity-0 flex flex-col items-center gap-2" id="volume-gesture">
<span class="material-symbols-outlined text-white/50 text-4xl">volume_up</span>
<div class="w-1 h-32 bg-white/20 rounded-full relative">
<div class="absolute bottom-0 w-full bg-white rounded-full" style="height: 40%"></div>
</div>
</div>
</div>
<!-- Bottom Control Cluster -->
<div class="fade-controls w-full max-w-4xl glass-panel rounded-3xl p-6 flex flex-col gap-6" id="bottom-controls">
<!-- Progress Slider Section -->
<div class="flex flex-col gap-2">
<div class="relative w-full h-1.5 bg-white/20 rounded-full group cursor-pointer">
<div class="absolute top-0 right-0 h-full bg-primary rounded-full" style="width: 28%"></div>
<div class="absolute top-1/2 -translate-y-1/2 right-[28%] w-4 h-4 bg-primary rounded-full shadow-[0_0_10px_rgba(192,193,255,0.6)] transform translate-x-1/2"></div>
</div>
<div class="flex justify-between items-center text-on-surface-variant font-medium text-xs">
<span>12:34</span>
<span>45:00</span>
</div>
</div>
<!-- Transport & Utilities -->
<div class="flex flex-col gap-6">
<!-- Main Controls -->
<div class="flex items-center justify-between">
<!-- Right Utilities -->
<div class="flex items-center gap-4">
<button class="text-white opacity-80 hover:opacity-100"><span class="material-symbols-outlined">shuffle</span></button>
<button class="text-white opacity-80 hover:opacity-100"><span class="material-symbols-outlined">skip_previous</span></button>
</div>
<!-- Center Play -->
<button class="w-16 h-16 bg-primary text-on-primary rounded-full flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition-all">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<!-- Left Utilities -->
<div class="flex items-center gap-4">
<button class="text-white opacity-80 hover:opacity-100"><span class="material-symbols-outlined">skip_next</span></button>
<button class="text-white opacity-80 hover:opacity-100"><span class="material-symbols-outlined">repeat</span></button>
</div>
</div>
<!-- Secondary Row -->
<div class="flex items-center justify-around pt-2 border-t border-white/5">
<button class="flex flex-col items-center gap-1 group">
<span class="material-symbols-outlined text-white/70 group-hover:text-primary transition-colors">aspect_ratio</span>
<span class="text-[10px] text-white/50 group-hover:text-primary uppercase tracking-wider">النسبة</span>
</button>
<button class="flex flex-col items-center gap-1 group">
<span class="text-sm font-bold text-white/70 group-hover:text-primary transition-colors">1.0x</span>
<span class="text-[10px] text-white/50 group-hover:text-primary uppercase tracking-wider">السرعة</span>
</button>
<button class="flex flex-col items-center gap-1 group">
<span class="material-symbols-outlined text-white/70 group-hover:text-primary transition-colors">closed_caption</span>

</button>
<button class="flex flex-col items-center gap-1 group">
<span class="material-symbols-outlined text-white/70 group-hover:text-primary transition-colors">lock_open</span>
<span class="text-[10px] text-white/50 group-hover:text-primary uppercase tracking-wider">قفل</span>
</button>
<button class="flex flex-col items-center gap-1 group">
<span class="material-symbols-outlined text-white/70 group-hover:text-primary transition-colors">settings</span>
<span class="text-[10px] text-white/50 group-hover:text-primary uppercase tracking-wider">إعدادات</span>
</button>
</div>
</div>
</div>
</div>
<!-- Status Bar (Mobile feel) -->
<div class="fixed top-0 left-0 w-full h-8 flex items-center justify-between px-6 z-50 pointer-events-none text-white/70 text-xs font-medium">
<div class="flex items-center gap-2">
<span>12:45</span>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-xs">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-xs">wifi</span>
<span class="material-symbols-outlined text-xs">battery_5_bar</span>
</div>
</div>
<script>
        let controlsVisible = true;
        let controlTimeout;

        const topBar = document.getElementById('top-bar');
        const bottomControls = document.getElementById('bottom-controls');
        const centralPlay = document.getElementById('central-play');
        const videoSurface = document.getElementById('video-surface');

        function toggleControls() {
            controlsVisible = !controlsVisible;
            const opacity = controlsVisible ? '1' : '0';
            const pointerEvents = controlsVisible ? 'auto' : 'none';

            topBar.style.opacity = opacity;
            bottomControls.style.opacity = opacity;
            centralPlay.style.opacity = opacity;
            
            topBar.style.pointerEvents = pointerEvents;
            bottomControls.style.pointerEvents = pointerEvents;
            centralPlay.style.pointerEvents = pointerEvents;

            if (controlsVisible) {
                resetTimeout();
            }
        }

        function resetTimeout() {
            clearTimeout(controlTimeout);
            controlTimeout = setTimeout(() => {
                if (controlsVisible) toggleControls();
            }, 5000);
        }

        // Initialize timer
        resetTimeout();

        // Drag simulation for brightness/volume feedback
        let startX, startY;
        videoSurface.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        });

        videoSurface.addEventListener('touchmove', (e) => {
            const currentY = e.touches[0].clientY;
            const diffY = startY - currentY;
            const screenHalf = window.innerWidth / 2;

            if (e.touches[0].clientX < screenHalf) {
                // Left side: Brightness
                const indicator = document.getElementById('brightness-gesture');
                indicator.style.opacity = '1';
                setTimeout(() => indicator.style.opacity = '0', 1000);
            } else {
                // Right side: Volume
                const indicator = document.getElementById('volume-gesture');
                indicator.style.opacity = '1';
                setTimeout(() => indicator.style.opacity = '0', 1000);
            }
        });
    </script>
</body></html>
