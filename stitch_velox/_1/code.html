<!DOCTYPE html>

<html class="dark" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Velox - Onboarding 3</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#301400",
                        "background": "#131313",
                        "on-surface-variant": "#c7c4d7",
                        "surface-dim": "#131313",
                        "inverse-surface": "#e5e2e1",
                        "tertiary-fixed": "#ffdcc5",
                        "on-primary-container": "#0d0096",
                        "on-tertiary-fixed-variant": "#703700",
                        "on-error-container": "#ffdad6",
                        "primary-fixed": "#e1e0ff",
                        "surface": "#131313",
                        "surface-container-highest": "#353534",
                        "on-surface": "#e5e2e1",
                        "on-secondary": "#381385",
                        "on-background": "#e5e2e1",
                        "tertiary-fixed-dim": "#ffb783",
                        "tertiary-container": "#d97721",
                        "secondary": "#cebdff",
                        "surface-tint": "#c0c1ff",
                        "surface-bright": "#3a3939",
                        "outline": "#908fa0",
                        "secondary-container": "#4f319c",
                        "on-primary-fixed": "#07006c",
                        "primary": "#c0c1ff",
                        "surface-container-high": "#2a2a2a",
                        "secondary-fixed": "#e8ddff",
                        "surface-container": "#201f1f",
                        "on-error": "#690005",
                        "surface-variant": "#353534",
                        "primary-fixed-dim": "#c0c1ff",
                        "tertiary": "#ffb783",
                        "on-secondary-fixed-variant": "#4f319c",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "surface-container-lowest": "#0e0e0e",
                        "on-secondary-fixed": "#21005e",
                        "error-container": "#93000a",
                        "error": "#ffb4ab",
                        "on-tertiary": "#4f2500",
                        "on-secondary-container": "#bea8ff",
                        "secondary-fixed-dim": "#cebdff",
                        "on-primary": "#1000a9",
                        "inverse-on-surface": "#313030",
                        "surface-container-low": "#1c1b1b",
                        "on-tertiary-container": "#452000",
                        "inverse-primary": "#494bd6",
                        "primary-container": "#8083ff",
                        "outline-variant": "#464554"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "gutter": "16px",
                        "container-margin": "20px",
                        "stack-md": "16px",
                        "stack-lg": "32px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["IBM Plex Sans Arabic"],
                        "display-lg": ["IBM Plex Sans Arabic"],
                        "body-md": ["IBM Plex Sans Arabic"],
                        "label-sm": ["IBM Plex Sans Arabic"],
                        "body-lg": ["IBM Plex Sans Arabic"],
                        "headline-md": ["IBM Plex Sans Arabic"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "display-lg": ["34px", { "lineHeight": "44px", "letterSpacing": "0px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "letterSpacing": "0px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "letterSpacing": "0px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "0px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .glow-effect::before {
            content: '';
            position: absolute;
            inset: -20px;
            background: radial-gradient(circle at center, rgba(192, 193, 255, 0.15) 0%, transparent 70%);
            z-index: -1;
            border-radius: inherit;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden font-body-md text-body-md md:font-body-lg md:text-body-lg">
<!-- Background Gradient for depth -->
<div class="absolute inset-0 bg-gradient-to-b from-background via-surface-container to-background opacity-80 z-0 pointer-events-none"></div>
<main class="w-full max-w-md mx-auto px-container-margin py-stack-lg flex flex-col items-center justify-between min-h-screen relative z-10">
<!-- Top Nav / Back Action (Simulated for flow if needed, but linear onboarding usually suppresses global nav) -->
<header class="w-full flex justify-between items-center pt-stack-sm pb-stack-lg">
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
<span class="font-label-sm text-label-sm">رجوع</span>
</button>
<div class="font-headline-md text-headline-md-mobile text-primary font-bold">Velox</div>
</header>
<!-- Content Area -->
<div class="flex-1 flex flex-col items-center justify-center w-full gap-stack-lg animate-[fadeIn_0.5s_ease-out]">
<!-- Illustration / Icon Area -->
<div class="relative w-48 h-48 md:w-64 md:h-64 flex items-center justify-center mb-stack-md glow-effect">
<div class="absolute inset-0 rounded-full border border-outline/20 animate-[spin_20s_linear_infinite]"></div>
<div class="absolute inset-4 rounded-full border border-primary/30 border-dashed animate-[spin_15s_linear_infinite_reverse]"></div>
<div class="glass-panel w-32 h-32 md:w-40 md:h-40 rounded-full flex items-center justify-center relative z-10 shadow-lg border border-white/10">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1; font-size: 64px;">folder_open</span>
</div>
<!-- Floating secondary icons -->
<div class="absolute top-4 right-4 glass-panel p-3 rounded-full border border-white/10 shadow-md">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1; font-size: 24px;">music_note</span>
</div>
<div class="absolute bottom-4 left-4 glass-panel p-3 rounded-full border border-white/10 shadow-md">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1; font-size: 24px;">movie</span>
</div>
</div>
<!-- Text Content -->
<div class="text-center flex flex-col gap-stack-sm max-w-[300px]">
<h1 class="font-display-lg text-display-lg text-primary-fixed-dim">الوصول للملفات</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    نحتاج للوصول إلى ملفاتك لتنظيم مكتبتك وعرض الوسائط الخاصة بك بأفضل جودة ممكنة.
                </p>
</div>
</div>
<!-- Action Area -->
<div class="w-full flex flex-col gap-stack-md mt-stack-lg pb-stack-lg">
<button class="w-full py-4 rounded-full bg-[#6366F1] text-white font-headline-md text-headline-md-mobile hover:bg-opacity-90 transition-all duration-300 shadow-[0_0_20px_rgba(99,102,241,0.3)] flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                السماح بالوصول إلى الوسائط
            </button>
<button class="w-full py-4 rounded-full glass-panel border border-white/20 text-on-surface-variant font-label-sm text-label-sm hover:bg-white/10 transition-all duration-300">
                تخطي الآن
            </button>
</div>
<!-- Pagination Indicators -->
<div class="flex gap-2 justify-center items-center pb-stack-md">
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-6 h-2 rounded-full bg-primary shadow-[0_0_8px_rgba(192,193,255,0.5)]"></div>
</div>
</main>
</body></html>
