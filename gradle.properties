# Project-wide Gradle settings.

# JVM heap for the Gradle daemon. Bump -Xmx if you hit OOM on large module graphs.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself, avoiding pulling in resources from dependencies.
android.enableJetifier=false
