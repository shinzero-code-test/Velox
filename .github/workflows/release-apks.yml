name: Build & Publish Release APKs

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build signed APKs (all ABIs) & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The repo ships no committed wrapper scripts/jar, so provision Gradle
      # here and generate the wrapper on the fly from the committed
      # gradle/wrapper/gradle-wrapper.properties version.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
          cache-read-only: false

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.5.1 --no-daemon

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/velox-release.jks"

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" > /dev/null

      - name: Build signed release APKs (per-ABI + universal)
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/velox-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -Pvelox.abiSplits=true --stacktrace

      - name: Rename APKs
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd app/build/outputs/apk/release
          for f in app-*-release.apk; do
            [ -e "$f" ] || continue
            abi="${f#app-}"; abi="${abi%-release.apk}"
            mv "$f" "Velox-${TAG}-${abi}.apk"
          done
          ls -la

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Velox-${{ github.ref_name }}-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
